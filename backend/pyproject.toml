[project]
name = "socralife-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "sqlalchemy==2.0.43", "alembic==1.16.5", "psycopg[binary]==3.2.10", "pgvector==0.4.1", "pydantic-settings==2.10.1", "httpx==0.28.1", "PyJWT[crypto]==2.10.1", "python-multipart==0.0.20", "boto3==1.40.30", "pypdf==6.0.0", "python-docx==1.2.0", "jsonschema==4.25.1"]
[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
